databases:
  - name: padafand-leaderboard-db
    databaseName: padafand_leaderboard_db
    user: padafand_leaderboard_db_user
    plan: free
services:
  - type: web
    name: padafand-admin-panel-frankfurt
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: padafand-leaderboard-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
