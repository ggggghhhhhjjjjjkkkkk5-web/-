<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت فرماندهی پدافند</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111d;color:#eef6ff;font-family:Tahoma,Arial}main{max-width:1100px;margin:auto;padding:20px}.panel{background:#101f30;border:1px solid #29445e;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.stat{background:#0a1725;border:1px solid #29445e;border-radius:13px;padding:16px}.num{font-size:27px;color:#7bd8ff;margin-top:9px}input,textarea,button{font:14px Tahoma;border-radius:10px;padding:12px;border:1px solid #34536d;background:#071725;color:white;width:100%;margin:5px 0}button{background:#1676ce;border:0;font-weight:bold;cursor:pointer}button.secondary{background:#31465d}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:10px;border-bottom:1px solid #29445e;text-align:right}small,.muted{color:#a7bfd3}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){main{padding:12px}.row{grid-template-columns:1fr}table{display:block;overflow:auto}}</style></head><body><main>
<h2>🛡️ پنل مدیریت فرماندهی پدافند</h2><p class="muted">آمار و کنترل آنلاین بازی</p>
<section id="login" class="panel"><h3>ورود مدیر</h3><input id="password" type="password" placeholder="رمز عبور مدیر"><button onclick="login()">ورود به پنل</button><p id="loginMsg"></p></section>
<div id="app" class="hidden">
<div class="grid"><div class="stat">بازیکنان آنلاین<div class="num" id="online">۰</div></div><div class="stat">کل کاربران<div class="num" id="total">۰</div></div><div class="stat">کاربران امروز<div class="num" id="today">۰</div></div><div class="stat">کل بازی‌ها<div class="num" id="games">۰</div></div></div>
<section class="panel"><h3>تنظیمات زنده بازی</h3><div class="row"><label>قیمت موشک رهگیر<input id="price" type="number" min="1"></label><label>عنوان بازی<input id="title"></label></div><label>اطلاعیه داخل بازی<textarea id="announcement" rows="3"></textarea></label><button onclick="saveSettings()">ذخیره و اعمال آنلاین</button><span id="settingsMsg" class="muted"></span></section>
<section class="panel"><h3>مدیریت رویدادها</h3><input id="eventTitle" placeholder="عنوان رویداد"><textarea id="eventDesc" placeholder="توضیحات رویداد"></textarea><div class="row"><input id="starts" type="datetime-local"><input id="ends" type="datetime-local"></div><button onclick="addEvent()">ایجاد رویداد</button><div id="events"></div></section>
<section class="panel"><h3>بازیکنان و فعالیت‌ها</h3><button class="secondary" onclick="refresh()">بروزرسانی آمار</button><div style="overflow:auto"><table><thead><tr><th>شناسه ناشناس</th><th>آخرین امتیاز</th><th>رکورد</th><th>بازی‌ها</th><th>آخرین فعالیت</th></tr></thead><tbody id="players"></tbody></table></div></section>
<section class="panel"><h3>جدول برترین‌ها</h3><div id="leaders"></div><button class="secondary" onclick="logout()">خروج مدیر</button></section>
</div></main><script>
let token=sessionStorage.getItem("padafandAdminToken")||"";
async function api(url,opts={}){let r=await fetch("/api/admin/"+url,{...opts,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...opts.headers}});if(r.status===401){logout();throw Error("نشست پایان یافت");}if(!r.ok)throw Error("خطا در ارتباط با سرور");return r.json();}
async function login(){try{let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});let d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;sessionStorage.setItem("padafandAdminToken",token);document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");refresh();}catch(e){document.getElementById("loginMsg").textContent=e.message;}}
function logout(){sessionStorage.removeItem("padafandAdminToken");token="";document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden");}
async function refresh(){try{let d=await api("stats");online.textContent=d.online;total.textContent=d.total;today.textContent=d.today;games.textContent=d.games;price.value=d.settings.data.missilePrice||10;title.value=d.settings.data.gameTitle||"فرماندهی پدافند";announcement.value=d.settings.data.announcement||"";leaders.innerHTML=d.leaders.map((p,i)=>"<p>"+(i+1)+". "+esc(p.player_id)+" — "+p.best_score+" امتیاز</p>").join("")||"هنوز رکوردی ثبت نشده";events.innerHTML=d.events.map(e=>"<p><b>"+esc(e.title)+"</b> — "+(e.active?"فعال":"غیرفعال")+" <button class='secondary' style='width:auto' onclick='toggleEvent("+e.id+","+(!e.active)+")'>تغییر وضعیت</button></p>").join("")||"رویدادی ثبت نشده";let ps=await api("players");players.innerHTML=ps.map(p=>"<tr><td>"+esc(p.player_id)+"</td><td>"+p.last_score+"</td><td>"+p.best_score+"</td><td>"+p.games+"</td><td>"+new Date(p.last_seen).toLocaleString("fa-IR")+"</td></tr>").join("");}catch(e){console.error(e);}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function saveSettings(){try{await api("settings",{method:"PUT",body:JSON.stringify({missilePrice:price.value,gameTitle:title.value,announcement:announcement.value})});settingsMsg.textContent="ذخیره شد؛ بازی‌ها طی چند ثانیه تنظیمات را دریافت می‌کنند.";}catch(e){settingsMsg.textContent=e.message;}}
async function addEvent(){try{await api("events",{method:"POST",body:JSON.stringify({title:eventTitle.value,description:eventDesc.value,startsAt:starts.value||null,endsAt:ends.value||null})});eventTitle.value="";eventDesc.value="";refresh();}catch(e){alert(e.message);}}
async function toggleEvent(id,active){await api("events/"+id,{method:"PATCH",body:JSON.stringify({active})});refresh();}
if(token){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");refresh();}
setInterval(()=>{if(token)refresh()},15000);
</script></body></html>
